name: Unsnooze cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: unsnooze
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/cron/unsnooze
        run: |
          set -euo pipefail
          response=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${BASE_URL}/api/cron/unsnooze")
          echo "status=$response"
          cat /tmp/body
          test "$response" = "200"
        env:
          BASE_URL: https://relay-customer-hub.vercel.app
